name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    # WPF(net10.0-windows) 이므로 windows 러너에서만 빌드된다.
    name: 빌드 + 단위 테스트
    runs-on: windows-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v5

      - name: .NET 10 SDK 설치
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: 복원
        run: dotnet restore SSPen.sln

      - name: 빌드 (Release)
        run: dotnet build SSPen.sln -c Release --no-restore

      # 통합 테스트(tests/SSPen.IntegrationTests)는 3x1920x1080 토폴로지와 대화형 데스크톱을
      # 하드 단언하므로 CI에서 실행하지 않는다 — 빌드만 검증한다.
      - name: 단위 테스트
        run: >
          dotnet test tests/SSPen.Tests/SSPen.Tests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=unit-tests.trx"
          --results-directory artifacts/test-results

      - name: 테스트 결과 업로드
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: unit-test-results
          path: artifacts/test-results/*.trx
          if-no-files-found: warn
